[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["E402"]
"tests/*.py" = ["E402"]
"flask/helpers/chordanalyzer_mp.py" = ["F841"]
"flask/helpers/chordanalyzer_quantized_patch.py" = ["F401", "F811", "F541", "F841", "B007"]
"flask/helpers/liverecord.py" = ["F401", "F811"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
